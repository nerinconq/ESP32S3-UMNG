<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhySyS Lab - v4</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; background-color: #f4f4f9; color: #333; }
    h2 { margin-top: 5px; color: #0056b3; font-size: 20px; }
    .controles { margin-bottom: 15px; }
    select { font-size: 16px; padding: 5px; border-radius: 5px; }
    .dashboard { display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 15px; }
    .data-box { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 30%; min-width: 90px; margin-bottom: 5px; }
    .data-box span { display: block; font-size: 20px; font-weight: bold; margin-top: 5px; }
    canvas { background: white; border: 2px solid #ccc; border-radius: 8px; width: 100%; max-width: 600px; height: 250px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .ejes { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>Cinemática Interactiva</h2>
  
  <div class="controles">
    <label for="variableSelect"><strong>Visualizar: </strong></label>
    <select id="variableSelect">
      <option value="d">Posición (m)</option>
      <option value="v">Velocidad (m/s)</option>
      <option value="a">Aceleración (m/s²)</option>
    </select>
  </div>

  <div class="dashboard">
    <div class="data-box">P (m) <span id="valP" style="color:#d9534f;">0.000</span></div>
    <div class="data-box">V (m/s) <span id="valV" style="color:#5cb85c;">0.000</span></div>
    <div class="data-box">A (m/s²) <span id="valA" style="color:#f0ad4e;">0.000</span></div>
  </div>
  
  <canvas id="grafica" width="600" height="250"></canvas>
  <div class="ejes" id="textoEje">Eje X: Tiempo (s) | Eje Y: Posición (m)</div>
  
  <script>
    const canvas = document.getElementById('grafica');
    const ctx = canvas.getContext('2d');
    const selectBox = document.getElementById('variableSelect');
    const textoEje = document.getElementById('textoEje');
    
    let historico = []; 
    const maxPuntos = 50;
    const colores = { d: '#d9534f', v: '#5cb85c', a: '#f0ad4e' };
    const nombresY = { d: 'Posición (m)', v: 'Velocidad (m/s)', a: 'Aceleración (m/s²)' };

    function dibujarGrafica() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if(historico.length < 2) return;

      const varSel = selectBox.value;
      textoEje.innerText = `Eje X: Tiempo (s) | Eje Y: ${nombresY[varSel]}`;

      let t_inicio = historico[0].t;
      let t_fin = historico[historico.length - 1].t;
      let rangoT = t_fin - t_inicio;
      if (rangoT === 0) rangoT = 1;

      let valoresY = historico.map(p => p[varSel]);
      let maxY = Math.max(...valoresY);
      let minY = Math.min(...valoresY);

      let margen = (maxY - minY) * 0.1;
      if(margen === 0) margen = 0.1;
      maxY += margen;
      minY -= margen;

      if(varSel === 'd' && minY > 0) minY = 0;

      if(minY < 0 && maxY > 0) {
        let yCero = canvas.height - ((0 - minY) / (maxY - minY)) * canvas.height;
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(0, yCero);
        ctx.lineTo(canvas.width, yCero);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.beginPath();
      ctx.strokeStyle = colores[varSel]; 
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';

      for(let i = 0; i < historico.length; i++) {
        let p = historico[i];
        let x = ((p.t - t_inicio) / rangoT) * canvas.width;
        let y = canvas.height - ((p[varSel] - minY) / (maxY - minY)) * canvas.height;
        
        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    selectBox.addEventListener('change', dibujarGrafica);

    setInterval(() => {
      fetch('/datos').then(r => r.json()).then(datos => {
        document.getElementById('valP').innerText = datos.d.toFixed(3);
        document.getElementById('valV').innerText = datos.v.toFixed(3);
        document.getElementById('valA').innerText = datos.a.toFixed(3);
        
        let tiempoSegundos = datos.t / 1000.0;
        
        historico.push({ t: tiempoSegundos, d: datos.d, v: datos.v, a: datos.a });
        if(historico.length > maxPuntos) historico.shift();
        
        dibujarGrafica();
      }).catch(err => console.log("Buscando señal..."));
    }, 100);
  </script>
</body>
</html>

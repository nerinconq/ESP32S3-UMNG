<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhySyS Lab Angular - v4</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; background-color: #f4f4f9; color: #333; }
    h2 { margin-top: 5px; color: #0056b3; font-size: 20px; }
    .controles { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    select, button { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
    button { background: #0056b3; color: white; cursor: pointer; border: none; }
    .status-gpo { padding: 5px 10px; border-radius: 15px; background: #ddd; font-size: 12px; }
    .active { background: #5cb85c; color: white; }
    .dashboard { display: flex; justify-content: space-around; flex-wrap: wrap; margin-bottom: 15px; }
    .data-box { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 30%; min-width: 90px; }
    .data-box span { display: block; font-size: 20px; font-weight: bold; margin-top: 5px; }
    canvas { background: white; border: 2px solid #ccc; border-radius: 8px; width: 100%; max-width: 600px; height: 250px; }
  </style>
</head>
<body>
  <h2>Cinemática Angular Interactiva</h2>
  
  <div class="controles">
    <select id="variableSelect">
      <option value="ang">Posición (rad)</option>
      <option value="vel">Velocidad (rad/s)</option>
      <option value="acel">Aceleración (rad/s²)</option>
    </select>
    <button onclick="invertirEje()">Invertir DIR</button>
    <span id="indGPO" class="status-gpo">GP0</span>
  </div>

  <div class="dashboard">
    <div class="data-box">θ (rad) <span id="valP" style="color:#d9534f;">0.000</span></div>
    <div class="data-box">ω (rad/s) <span id="valV" style="color:#5cb85c;">0.000</span></div>
    <div class="data-box">α (rad/s²) <span id="valA" style="color:#f0ad4e;">0.000</span></div>
  </div>
  
  <canvas id="grafica" width="600" height="250"></canvas>
  
  <script>
    const canvas = document.getElementById('grafica'), ctx = canvas.getContext('2d');
    const selectBox = document.getElementById('variableSelect');
    let historico = []; 
    const colores = { ang: '#d9534f', vel: '#5cb85c', acel: '#f0ad4e' };

    function invertirEje() {
      fetch('/toggleDIR').then(r => r.text()).then(res => {
        console.log("Pin DIR en: " + res);
        historico = []; // Limpiar para evitar saltos
      });
    }

    function dibujarGrafica() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if(historico.length < 2) return;
      const varSel = selectBox.value;
      let t_inicio = historico[0].t, rangoT = historico[historico.length-1].t - t_inicio || 1;
      let valoresY = historico.map(p => p[varSel]);
      let maxY = Math.max(...valoresY), minY = Math.min(...valoresY);
      let margen = (maxY - minY) * 0.1 || 0.1; maxY += margen; minY -= margen;

      ctx.beginPath(); ctx.strokeStyle = colores[varSel]; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      for(let i = 0; i < historico.length; i++) {
        let x = ((historico[i].t - t_inicio) / rangoT) * canvas.width;
        let y = canvas.height - ((historico[i][varSel] - minY) / (maxY - minY)) * canvas.height;
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    setInterval(() => {
      fetch('/datos').then(r => r.json()).then(d => {
        document.getElementById('valP').innerText = d.ang.toFixed(3);
        document.getElementById('valV').innerText = d.vel.toFixed(3);
        document.getElementById('valA').innerText = d.acel.toFixed(3);
        
        const gpo = document.getElementById('indGPO');
        if(d.gpo == 1) gpo.classList.add('active'); else gpo.classList.remove('active');

        historico.push({ t: d.t/1000.0, ang: d.ang, vel: d.vel, acel: d.acel });
        if(historico.length > 50) historico.shift();
        dibujarGrafica();
      });
    }, 100);
  </script>
</body>
</html>
